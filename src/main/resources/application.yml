server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: data-cache-service
  lifecycle:
    timeout-per-shutdown-phase: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # dataCacheReadiness only actually gates readiness when
        # data-cache.startup.execution-mode=BLOCK_UNTIL_REQUIRED_CACHE_READY (see
        # docs/23-STARTUP-CACHE-LIFECYCLE.md); in the default ASYNC mode it always reports UP.
        readiness:
          include: readinessState,dataCacheReadiness
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.enterprise.datacache: INFO

data-cache:
  enabled: true

  # See docs/23-STARTUP-CACHE-LIFECYCLE.md. ASYNC (the default) never delays application startup;
  # BLOCK_UNTIL_REQUIRED_CACHE_READY additionally gates the readiness probe (above) on every
  # dataset marked required: true (the default) actually having a usable cache.
  startup:
    execution-mode: ${DATA_CACHE_STARTUP_EXECUTION_MODE:ASYNC}
    timeout: 30m

  # See docs/DATA-CACHE-DEVELOPER-GUIDE.md#monitoring-a-cache-refresh-from-logs. A progress line is
  # emitted whenever row-interval rows have been processed since the last one OR time-interval has
  # elapsed since the last one, whichever comes first - never per row, never per Arrow batch.
  logging:
    progress:
      enabled: true
      row-interval: 1000000
      time-interval: 30s
      include-file-size: true
      include-batch-count: true

  dremio:
    host: ${DREMIO_HOST:}
    port: ${DREMIO_PORT:32010}
    username: ${DREMIO_USERNAME:}
    password: ${DREMIO_PASSWORD:}
    ssl-enabled: ${DREMIO_SSL_ENABLED:true}
    connect-timeout: 30s
    query-timeout: 30m
    verification-sql: "SELECT 1"

  arrow:
    max-memory: ${DATA_CACHE_ARROW_MAX_MEMORY:2GB}

  duckdb:
    base-directory: ${DATA_CACHE_BASE_DIR:/data/cache}
    temp-directory: ${DATA_CACHE_TEMP_DIR:/data/cache/temp}
    memory-limit: ${DATA_CACHE_DUCKDB_MEMORY_LIMIT:8GB}
    threads: ${DATA_CACHE_DUCKDB_THREADS:8}
    max-versions: 2

  refresh:
    max-concurrent-datasets: 2
    recover-on-startup: true

  pagination:
    default-page-size: 100
    max-page-size: 5000

  datasets:

    financial:
      enabled: true
      required: true
      table-name: financial
      source-sql: classpath:datacache/dremio/financial.sql
      startup:
        mode: USE_EXISTING_OR_CREATE
      refresh-cron: "0 0 1,4,7,10,13,16,19 * * *"
      # Optional: used only to compute estimatedPercent in progress logs/status - never affects
      # refresh, validation, or retention behavior. Remove if you'd rather not guess a target.
      progress:
        expected-row-count: 30000000
      retry:
        max-attempts: 3
        initial-delay: 10s
        multiplier: 2
        max-delay: 60s
      validation:
        minimum-row-count: 1000000
        required-columns:
          - fiscal_year
          - fiscal_month
          - cost_center
          - actual_amount
          - forecast_amount
        sql: classpath:datacache/validation/financial.sql

    organization:
      enabled: true
      required: true
      table-name: organization
      source-sql: classpath:datacache/dremio/organization.sql
      startup:
        mode: USE_EXISTING_OR_CREATE
      refresh-cron: "0 30 2,8,14,20 * * *"
      retry:
        max-attempts: 3
        initial-delay: 10s
        multiplier: 2
        max-delay: 60s
      validation:
        minimum-row-count: 1
        required-columns:
          - cost_center
          - business_unit
          - cio
          - department

    headcount:
      enabled: true
      # Not required for readiness: in BLOCK_UNTIL_REQUIRED_CACHE_READY mode the readiness probe
      # will report UP once financial/organization are ready even if headcount is still loading.
      required: false
      table-name: headcount
      source-sql: classpath:datacache/dremio/headcount.sql
      startup:
        mode: ALWAYS_REFRESH
      refresh-cron: "0 15 3,9,15,21 * * *"
      retry:
        max-attempts: 3
        initial-delay: 10s
        multiplier: 2
        max-delay: 60s
      validation:
        minimum-row-count: 1
        required-columns:
          - cost_center
          - fiscal_year
          - fiscal_month
          - headcount_count

  queries:

    financial-summary:
      sql: classpath:datacache/query/financial-summary.sql
      datasets:
        - financial

    cfo-summary:
      sql: classpath:datacache/query/cfo-summary.sql
      datasets:
        - financial
        - organization

    headcount-summary:
      sql: classpath:datacache/query/headcount-summary.sql
      datasets:
        - headcount
        - organization
